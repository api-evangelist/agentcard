generated: '2026-07-17'
method: searched
status: published
source: https://www.agentcard.sh/.well-known/mcp/server-card.json
server:
  name: Agentcard
  description: Virtual Visa cards for AI agents with MCP-native spending controls and per-task budget
    limits.
  transport: http
  url: https://mcp.agentcard.sh/mcp
  version: 1.0.0
authorization:
  type: oauth2
  scheme: OAuth 2.1 + PKCE (S256)
  authorization_server: https://mcp.agentcard.sh
  authorization_endpoint: https://mcp.agentcard.sh/authorize
  token_endpoint: https://mcp.agentcard.sh/token
  registration_endpoint: https://mcp.agentcard.sh/register
  revocation_endpoint: https://mcp.agentcard.sh/revoke
  resource: https://mcp.agentcard.sh/mcp
  discovery:
  - https://mcp.agentcard.sh/.well-known/oauth-authorization-server
  - https://mcp.agentcard.sh/.well-known/oauth-protected-resource
  notes: No API keys — the first tool call opens the OAuth flow. Company integrations pass each end-user's
    Bearer token. Tools list dynamically; register whatever tools/list returns.
install:
  claude_code: claude mcp add --transport http agent-cards https://mcp.agentcard.sh/mcp
  cli_helper: agent-cards setup-mcp
  config: '{ "mcpServers": { "agent-cards": { "url": "https://mcp.agentcard.sh/mcp" } } }'
tools:
- name: get_instructions
  description: Fetch the latest usage guide for shopping and workflows
- name: whoami
  description: Show which account this session is operating
- name: create_card
  description: Create a new virtual Visa card funded from the wallet
- name: list_cards
  description: List all virtual cards with balances and status
- name: get_card_details
  description: Get decrypted PAN
  CVV: null
  expiry (may require approval): null
- name: check_balance
  description: Check the live balance on a virtual card
- name: close_card
  description: Permanently close a virtual card
- name: pause_card
  description: Pause a multi-use card to block new charges
- name: resume_card
  description: Resume a paused multi-use card
- name: update_card_limit
  description: Raise or lower a multi-use card total spend limit
- name: list_transactions
  description: List transactions for a specific card
- name: list_all_transactions
  description: List transactions across all cards
- name: approve_request
  description: Approve or deny a pending approval request
- name: get_wallet
  description: Show the agent funding wallet and its balance
- name: fund_wallet
  description: Add money to the wallet with Apple Pay or Google Pay
- name: withdraw_wallet
  description: Withdraw wallet funds to a bank account or crypto address
- name: start_phone_verification
  description: Send a one-time code to unlock wallet funding
- name: verify_phone
