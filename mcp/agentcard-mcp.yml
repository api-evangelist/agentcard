generated: '2026-07-17'
method: searched
status: published
source: https://www.agentcard.sh/.well-known/mcp/server-card.json
server:
  name: Agentcard
  description: Virtual Visa cards for AI agents with MCP-native spending controls and per-task budget
    limits.
  transport: http
  url: https://mcp.agentcard.sh/mcp
  version: 1.0.0
authorization:
  type: oauth2
  scheme: OAuth 2.1 + PKCE (S256)
  authorization_server: https://mcp.agentcard.sh
  authorization_endpoint: https://mcp.agentcard.sh/authorize
  token_endpoint: https://mcp.agentcard.sh/token
  registration_endpoint: https://mcp.agentcard.sh/register
  revocation_endpoint: https://mcp.agentcard.sh/revoke
  resource: https://mcp.agentcard.sh/mcp
  discovery:
  - https://mcp.agentcard.sh/.well-known/oauth-authorization-server
  - https://mcp.agentcard.sh/.well-known/oauth-protected-resource
  notes: No API keys — the first tool call opens the OAuth flow. Company integrations pass each end-user's
    Bearer token. Tools list dynamically; register whatever tools/list returns.
install:
  claude_code: claude mcp add --transport http agent-cards https://mcp.agentcard.sh/mcp
  cli_helper: agent-cards setup-mcp
  config: '{ "mcpServers": { "agent-cards": { "url": "https://mcp.agentcard.sh/mcp" } } }'
tools:
- name: buy
  description: 'Shop and check out, in natural language, across the merchants the user has linked (DoorDash,
    etc.). Pass the whole ask as `request` — e.g. "order a caesar salad from Zuni on DoorDash" — and this
    tool runs the shopping flow for you. It is CONVERSATIONAL: this tool RETURNS a `conversation_id`;
    pass that SAME `conversation_id` back on every follow-up (your reply to a question, "add a coke",
    "yes, check out") so it continues the SAME order. Omit it (or set new_order=true) only to start a
    fresh order. It will ask for the delivery address and have you confirm the cart and total. CHECKOUT
    (which charges a one-time card) happens ONLY after the user explicitly confirms in a later message
    — relay the confirmation through `request` ("yes, place the order") on the SAME conversation_id. RELAY
    REPLIES VERBATIM: when the user answers a question from this tool ("yes", "the 16 oz one", "use my
    other card"), pass their reply through `request` as-is on the same conversation_id — do NOT rewrite
    it into a fresh full order command; a rewritten command reads as a NEW ask and the confirmation never
    lands. NEVER use new_order (or drop the conversation_id) to recover from an error or a refused checkout
    — that discards the cart and any pending confirmation. Stay on the same conversation_id and follow
    the error''s instruction instead; new_order is ONLY for the user starting an unrelated order. If it
    hands out a merchant login link (hosted connect), just reply on the SAME conversation_id once the
    user finishes (e.g. "done — I logged in") and it verifies the link itself. Logins started here have
    no pending_id, so the buy_connect / buy_connect_status pair does not apply to them. Call get_instructions
    FIRST for the current usage guide before your first buy.'
- name: surprise_me
  description: 'Buy the user something totally unexpected and very silly/stupid-fun under a small dollar
    cap (default $10, hard max $25). Great when the user cannot decide what to order (from DoorDash etc.)
    or just wants a fun surprise. It kicks off a shopping conversation that FIRST brainstorms deliberately
    stupid ideas, picks ONE genuinely unexpected item, builds the cart, and shows the item + exact total.
    It NEVER checks out by itself: the reply includes a conversation_id — relay the user''s explicit confirmation
    ("yes, place it") through the `buy` tool on that SAME conversation_id, exactly like a normal order.
    Each surprise_me call starts a fresh surprise; use `buy` for all follow-ups (answers, tweaks, the
    confirmation).'
- name: get_instructions
  description: Call this FIRST; returns the latest usage guide for shopping with `buy` AND for operating
    the Agentcard account tools (cards, funding, your own card, KYC, support).
- name: whoami
  description: 'Show who you are operating as: the authenticated AgentCard account''s email, user id,
    name, plan, KYC + account status, member-since date, and how this session is connected (personal login
    vs a third-party OAuth app connection, with the app name). Call this when the user asks "who am I"
    / "which account is this", or before money-moving actions when you need to confirm the account. Read-only.
    KYC shown here is the stored snapshot — use get_kyc_status when you need the live, provider-checked
    state.'
- name: list_cards
  description: 'The user''s wallet: every live card they hold, with IDs, last four digits, expiry, balance,
    and status, plus `vaultCards`: the user''s OWN cards stored in their Agentcard vault (display fields
    only; a vaulted card pays through buy with an approval on the user''s device (their passkey or master
    password) and never exposes a number). Start here to find available cards; if none are returned, call
    create_card. When the shared wallet is enabled, `wallet` lists every card across all connected apps
    and companies, each tagged with its source (kind personal/company, the issuing app, and the company
    where applicable); cards created by another app or company are read-only from this session: get_card_details
    and close_card will not work on them.'
- name: get_card_details
  description: Get decrypted PAN, CVV, expiry, and current balance for a specific card. Use this only
    when you need to fill in a payment form; prefer get_card_balance if you only need the balance. May
    require human approval before returning credentials. If approval is required, prompt the user and
    then call approve_request. Agentcard never stores an issued card's number or CVV; each call fetches
    them again.
  CVV: null
  expiry (may require approval): null
- name: get_card_balance
  description: 'The live balance of ONE virtual card (the user''s overall cash balance is get_balance).
    Prefer this over get_card_details when you only need to verify available funds: it is faster and does
    not expose sensitive card credentials.'
- name: close_card
  description: 'Permanently close a virtual card. This is irreversible — the card cannot be reopened.
    Safe to call on an already-closed card (idempotent). The user''s rewards card (the card their tokenback
    redeems onto) is close-protected: closing it returns its balance to the wallet but retires the card
    number the user may have on file at AI labs, so it requires confirm_rewards_card — set it ONLY after
    the user explicitly confirms they want the rewards card closed.'
- name: create_card
  description: 'The one card tool: get the user a virtual debit card for a purchase. Cards are live and
    charged for real when used. For a FIRST-TIME user it starts by putting the user''s OWN card in their
    Agentcard vault (any Visa, Mastercard, Amex, or Discover from any country, no identity verification
    (KYC), no balance funding): the call returns a secure link (vault_started); send it to the user (they
    type the card once and lock it with their passkey or master password; Agentcard never sees the number).
    A vaulted card pays through the buy tool, where the user approves each purchase on their device with
    their passkey or master password; it never becomes a card number you type, so after vault_started
    (or vault_ready, when a card is already in the vault) use buy for purchases instead of calling create_card
    again. If the user specifically needs a card NUMBER, that is an Agentcard funded from their cash balance,
    which requires KYC the first time: only after the user agrees, call create_card with source "issued".
    Established users: the saved default decides (get_settings default_payment: their chosen added card,
    or the wallet balance); with no saved default, an active ADDED card wins, otherwise the cash balance.
    Per-call overrides: connected_card_id issues against a specific added card, source "issued" forces
    the cash balance, restart_setup mints a fresh vault link. If the balance is short on the issued path,
    top up with add_funds. Connections through a company OAuth client have NO card count or amount limits;
    only first-party personal accounts have per-plan caps. Call get_plan for the limits in effect.'
- name: get_card_preset
  description: Read a card's preset (spend limits, rate limits, allowed categories/merchants, time windows,
    and surfaces) as a plain-English summary. A card without a preset is unrestricted.
- name: set_card_preset
  description: Update a card's preset. Pass a template name (ai_labs, weekday_meals, cli_only, daily),
    a saved preset name (from list_presets), a comma-separated template list, or inline JSON / { name,
    privileges }. Pass null or "" to clear the card's preset (Agentcard-side checks stop; any limit already
    on the card network stays). Edits create a new version. The response reports what was applied on Agentcard
    vs what was updated on the card's spend limit, and whether the change needs a new card.
- name: allow_card_merchant
  description: Remember a merchant on a card so the next matching charge is allowed even when the card's
    category or merchant rules would otherwise deny it. One tool call — does not replace the rest of the
    preset.
- name: list_presets
  description: 'List every preset you can use by name: the built-in templates (ai_labs, weekday_meals,
    cli_only, daily) plus any you''ve saved yourself, each with a plain-English summary of its rules.'
- name: save_preset
  description: 'Save your own preset — a named set of rules (spend caps, category/merchant/place/currency/day/hour/program
    restrictions) you can reuse by name in set_card_preset or create_card. Saving under a name you already
    used adds a new version: cards already using the old one keep it, new ones get the update. Pick a
    name other than the built-ins (ai_labs, weekday_meals, cli_only, daily). Pass either the rule fields
    below or a raw `privileges` array.'
- name: delete_preset
  description: Delete a preset you saved (from save_preset). Refuses built-in template names — there's
    nothing to delete there. Cards already issued keep whatever rules they have; this only retires the
    name for future use. Refused while a card still inherits the name as a standing default.
- name: get_wallet_link
  description: 'The user''s hosted wallet, as one shareable URL. Opens their Agentcard wallet in the browser:
    every card in one place, apply for an Agentcard card (identity verification runs right in the page).
    Mint it whenever the user needs a browser step (seeing cards, finishing verification when in-chat
    photos fail) and send them the URL. To ADD the user''s own card, pass purpose "add_card": the link
    then opens their Agentcard vault card form directly (any card, typed once, locked with their passkey
    or master password, never seen by Agentcard) and works on personal logins too. Pass merchant + amount_cents
    to open the wallet ON the payment-approval sheet (the user picks a card and approves that exact charge)
    instead of the card list. Multi-use but short-lived (about 15 minutes — the exact moment is in expiresAt);
    mint a fresh one when it expires. The wallet link only works for app connections (OAuth).'
- name: list_added_cards
  description: List the user's ADDED cards (their own Visa/Mastercard cards enrolled via create_card's
    add-card flow — the funding source that charges their own card), with ids, brand, last4, expiry, and
    status. The row marked isDefault is what create_card charges when no connected_card_id is given —
    the user's chosen default card (set with update_settings default_payment), falling back to the newest
    active one. Not the same as list_cards (the virtual cards Agentcard issues).
- name: remove_added_card
  description: 'Remove (unenroll) one of the user''s added cards. Irreversible for that enrollment: any
    virtual cards created against it are closed first, then the card is unenrolled at the network. ALWAYS
    confirm with the user before calling. Get ids from list_added_cards. The user can add the same card
    again later (create_card with restart_setup: true).'
- name: pause_card
  description: 'Pause a multi-use card: temporarily blocks ALL new charges (reversible — use resume_card
    to unblock). Right for "stop this subscription for now" or a card the user suspects is compromised
    but is not sure. Only multi-use cards can be paused; single-use cards close after one charge and cannot
    be paused.'
- name: resume_card
  description: Resume a paused multi-use card so it accepts charges again. The inverse of pause_card.
- name: update_card_limit
  description: Change a multi-use card's total spending limit. Raising it reserves the extra amount from
    the user's cash balance (top up with add_funds if short); lowering it frees the difference, but the
    new limit can never go below what the card has already spent. Single-use cards cannot be resized.
- name: get_rewards
  description: 'Show the user''s tokenback: balance, lifetime earned, and recent activity. Tokenback pays
    tokens (1 token = 1¢ of credit value) on settled card spend. AI cards (create_card scope_preset: ''ai_labs'')
    earn a boosted rate on AI-lab purchases, and companies can route a share of their earnings to their
    users as tokenback. Redeem with redeem_rewards.'
- name: redeem_rewards
  description: 'Redeem tokenback: the tokens'' cash value (1 token = 1¢) lands on the user''s rewards
    card as spending power. The rewards card is permanent and locked to AI-lab merchants (OpenAI, Anthropic,
    Gemini) — created on first redemption, topped up after. Check get_rewards first for the balance and
    the minimum. Ask the user before redeeming.'
- name: recommend_card
  description: Ask the vault which of the user's own stored cards earns the most for a purchase (smart
    purchases). Pass the merchant name, its website when you know it, and the amount. Returns the card
    id to use as card_id at checkout, the reason in plain words, and the runners-up. null when smart purchases
    is off for this account, no stored card has been named yet (see name_card), or nothing could be said;
    then pay as you would have. Never a card number.
- name: name_card
  description: Tell the vault which card product one of the user's own stored cards is (e.g. "Chase Sapphire
    Preferred", "Amex Gold"), so smart purchases can rank it. Takes a vault card id (a `vaultCards` row
    from list_cards) and the product name as the user says it; the closest match is saved and echoed back.
    Confirm with the user when the match is not obviously right. Pass clear_product to forget the name,
    or smart_excluded to keep a card out of the ranking without removing it.
- name: start_support_chat
  description: Start a new support conversation and send the first message
- name: send_support_message
  description: Send a message in an existing support conversation
- name: read_support_chat
  description: Read the message history of a support conversation
- name: list_pending_approvals
  description: 'List the user''s PENDING approval requests: asks from connected apps (create a card, view
    full card details, close/pause/resume a card, change a limit) waiting on the user''s decision. Surface
    each one to the user and let THEM decide; after the user answers, resolve with approve_request. NEVER
    approve or deny on your own — an approval is the user''s consent, not yours. Personal sessions only;
    company-connected sessions have no personal inbox.'
- name: approve_request
  description: 'Resolve a pending approval request (approve or deny) once the USER has decided. Use this
    after get_card_details or create_card returns a 202 requiring approval, or for a row from list_pending_approvals.
    For card_details and transaction, approval automatically completes the follow-up action and returns
    the result. For cross_app actions (asks from another app: close/pause/resume a card, change a limit,
    view details), approval records the user''s consent and the REQUESTING app completes the action from
    its side when it retries with the approval id.'
- name: submit_user_info
  description: 'Submit the user''s phone number and terms acceptance for a virtual card. Call this after
    create_card returns user_info_required. Do NOT ask the user for occupation, income, or account purpose
    — those are never asked. Identity fields (name, date of birth, SSN / national ID, address) belong
    to the KYC flow: create_card tells you whether it runs conversationally (start_kyc → ID photo → face
    scan) or via a hosted verification_url. After phone + terms are saved, retry create_card.'
- name: start_kyc
  description: 'Begin (or resume) identity verification. Verification is CONVERSATIONAL: it starts with
    a photo of the user''s government ID — the backend reads the printed details automatically and the
    user confirms every value. Only fields the ID does not carry are asked (like the SSN for US documents,
    or the national ID number for non-US ones); occupation/income questions are never asked. The only
    browser step is a short face scan at the end. Relay each step to the user as ONE SHORT message (one
    or two sentences — the current ask only, never the whole flow, never an unrequested link). Returns
    the next step, ID-photo upload options, and (for legacy hosted-flow accounts) a hosted verification
    URL instead.'
- name: get_kyc_status
  description: Check the user's identity verification (KYC) status. Returns whether they are verified
    and, if not, the current state plus the conversational next step. Use this to poll after the user
    does the face scan, or any time create_card reports kyc_required.
- name: submit_kyc_document
  description: 'Submit the user''s ID photo for identity verification. Ways in: (a) image data you hold
    programmatically (e.g. the user sent the photo in this chat and your platform exposes its bytes) —
    pass front_base64 (and back_base64 for a license back; its barcode reads most accurately); (b) local
    (stdio) mode — pass file_path/back_file_path and the file is read from disk; (c) neither — you get
    a secure upload link to hand the user. Do NOT ask the user what kind of document it is or where it
    was issued — the type and country are detected automatically from the photo; only relay a question
    if the result says the type could not be determined. Returns the fields read off the document — SHOW
    THEM TO THE USER for confirmation before continuing — plus whatever is still missing. If the result
    says NO identity details could be read, the image did not read as an ID at all: never insist to the
    user that it was their ID. Supported: JPEG/PNG/WebP up to 12MB (convert HEIC or HEIF photos first).'
- name: check_kyc_document
  description: Check the conversational verification state — use after the user uploads their ID via the
    browser upload link (or any time you need to re-orient). Returns the current step and the fields still
    missing.
- name: submit_kyc_fields
  description: 'Submit identity fields for verification: the ones the ID photo didn''t carry (listed by
    missingFields — the tax/ID number always has to be asked since IDs don''t print it; call it "SSN"
    only for US documents and "national ID number" otherwise), corrections to extracted values the user
    flagged, and the User Agreements acceptance (agreements_accepted, after presenting each agreement
    verbatim). That number is forwarded directly to the verification provider and never stored by Agentcard.
    NEVER ask about occupation, income, spending volume, or account purpose — those are filled automatically
    and must not be asked.'
- name: list_transactions
  description: Transactions with amount, merchant, status, and timestamps. Pass card_id for one card's
    transactions; OMIT it for every card in the account (newest first, each row tagged with its card).
    Use limit and status to filter. The gated views list_all_transactions and list_transactions_by_payment_method
    also exist; call them by name even though they aren't in the tools list.
- name: setup_payment_method
  description: Save a payment method used ONLY to pay for flight bookings (the fare is charged to it via
    a hold at booking; no virtual card is created for flights). It does NOT fund cards or the cash balance
    — cards are funded from the balance (see add_funds). Returns a secure checkout URL the user must open
    to save their card details.
- name: get_balance
  description: 'The user''s cash balance: the money that funds new cards. Provisions the balance account
    on first use. Users add cash with Apple Pay or Google Pay in USD; funds are held as USDC. (Their wallet,
    meaning the cards themselves, is list_cards.)'
- name: add_funds
  description: 'Generate a secure checkout link the user opens to add cash to their own balance (the money
    that funds new cards) via Apple Pay or Google Pay, in USD. Calling this tool moves NO money and initiates
    NO transfer: it only prepares a single-use hosted payment page — the exact equivalent of the user
    clicking ''Add funds'' in the dashboard. The user personally reviews, authorizes, and completes (or
    abandons) the payment in their own browser with their own payment method; you never see or handle
    payment credentials. If a one-time phone verification is needed first, this tool automatically sends
    the user a code and tells you where it went: ask the user for the code, call verify_phone with it,
    then call add_funds again.'
- name: start_phone_verification
  description: Send (or re-send) the user's one-time funding verification code (the provider verifies
    the phone on the user's Agentcard identity, valid 60 days). add_funds already sends this code automatically
    when verification is needed — call this tool only to RE-send when the code never arrived (any unexpired
    code still works; sends are rate-limited). Returns the masked destination (text or email) and whether
    a code was sent; if the phone is already verified it says so and you go straight to add_funds. After
    the user reads back the code, call verify_phone.
- name: verify_phone
  description: Check the one-time code the user received from start_phone_verification. On success the
    balance is unlocked for funding (the verification stays fresh for 60 days) — call add_funds next.
    A wrong or expired code returns a recoverable status so you can ask the user to re-check it, or call
    start_phone_verification to resend.
- name: redeem_code
  description: Redeem a promo code that adds money to the user's cash balance. Each code works once per
    user; the credit lands in the balance and becomes spendable within a minute or two. Some codes hold
    the money until the user verifies their identity — the claim still locks the code to this user instantly,
    and the credit lands automatically once KYC is approved (start_kyc begins verification). The gated
    tool list_codes shows the user's code history; call it by name even though it isn't in the tools list.
- name: get_plan
  description: 'Show the user''s current subscription plan, card limits, and this month''s usage. Call
    this before create_card when you need the per-card amount cap or remaining monthly quota, and ALWAYS
    before creating a multi-use card: multi-use cards are a paid-plan feature, so maxActiveMultiUseCards
    is 0 on Free and the mint is refused. Also call it whenever the user asks about their plan, limits,
    billing, or upgrading. To cancel a paid plan, the gated tool cancel_plan also exists; call it by name
    even though it isn''t in the tools list.'
  card limits: null
  and usage: null
- name: upgrade_plan
  description: 'Start a paid-plan upgrade. Choose the target plan: ''basic'' ($15/mo — 15 cards/month,
    up to $500 per card) or ''pro'' ($100/mo — 50 cards/month, up to $1,000 per card). Defaults to ''basic''
    if omitted. Returns a Stripe Checkout URL the user must open in their browser to complete payment.
    After they finish checkout, the plan updates automatically; verify with get_plan. Use only when the
    user explicitly wants to upgrade. To cancel a paid plan instead, the gated tool cancel_plan also exists;
    call it by name even though it isn''t in the tools list.'
- name: list_payment_methods
  description: List the saved payment methods (used only to pay for flight bookings, not for cards or
    adding funds). Returns each method with its id, brand, last 4 digits, and expiry, and marks the default
    one. Use setup_payment_method to add a new one. The gated tools set_default_payment_method and remove_payment_method
    also exist; call them by name even though they aren't in the tools list.
- name: list_connections
  description: List the third-party apps the user has connected to their Agentcard account via OAuth (e.g.
    Kilo), including when each was connected and whether it is still active. Read-only. To revoke an app,
    call revoke_connection with its clientId.
- name: revoke_connection
  description: Revoke a third-party app's access to the user's Agentcard account. Disconnects the app
    and invalidates its OAuth tokens; it must reconnect via OAuth to regain access. Pass the clientId
    shown by list_connections.
- name: get_settings
  description: View the user's notification preferences (which email alerts they receive), their default
    payment source (which card or balance agents charge — check it before picking a funding source for
    them), their default delivery address (the wallet-level shipping address to use when buying physical
    goods for them — check it before asking them to dictate an address), and authorization settings (whether
    viewing card details or making transactions requires explicit approval). Authorization settings are
    read-only here; change the rest with the gated tool update_settings, calling it by name even though
    it isn't in the tools list.
- name: link_account
  description: 'Link or merge another Agentcard account that belongs to the same person. Use when the
    user says they already have an account under a DIFFERENT email or phone number — most often after
    identity verification (KYC) is rejected as a duplicate, which means that person already verified on
    another account. Two steps: (1) call with { type, identifier } to send a one-time code to that email/phone;
    (2) call again with the { ticket, code } to verify. If the identifier belongs to a different account,
    the two accounts are MERGED (the identity-verified account survives and gains the other''s email/phone,
    so both sign in to one account); if no account has it, it is simply added to the current account.'
- name: buy_list_merchants
  description: 'List where Agentcard shops. With no arguments: the merchants that use an account (DoorDash,
    Good Eggs, flights, the retail stores) and whether this user has linked each, plus how many online
    stores Agentcard buys from with no account. To check one store, pass `query` with its name or domain
    (Nike, nordstrom.com): the search covers both kinds. An online store needs no link: ask buy for the
    product and name the store.'
- name: buy_unlink_merchant
  description: Disconnect a merchant — drops the saved session + link. The user must re-link (e.g. hosted
    connect) before shopping it again.
- name: buy_connect
  description: Connect a merchant for shopping. For merchants that need a real login (e.g. DoorDash) this
    opens a secure hosted browser session and returns a URL the user opens to log in; after they finish,
    call buy_connect_status with the pending_id to confirm. Merchants that need no login (e.g. Agentcard
    Flights) come back ready immediately. Use this instead of buy_link_merchant for hosted-login merchants.
    This tool pairs only with buy_connect_status and only tracks logins it started itself; a login link
    handed out by the conversational `buy` tool has no pending_id and is verified inside that same buy
    conversation (the user replies there, e.g. "done — I logged in").
- name: buy_connect_status
  description: 'Check the status of a hosted merchant login started with buy_connect. Returns linking
    (still in progress — call again in a few seconds), linked (success — the merchant is ready to shop),
    expired, or error. Pass the merchant and the pending_id from buy_connect. ONLY for logins started
    by the buy_connect tool: a login link handed out by the conversational `buy` tool has no pending_id
    — for those, reply to the same `buy` conversation ("done — I logged in") instead of calling this.'
- name: manage_subscription
  description: 'Manage a recurring meal/grocery SUBSCRIPTION (e.g. Locale) — NOT a one-time purchase,
    and no payment is taken (the subscription auto-bills the card on file at the merchant). action: ''menu_search''
    (browse the recurring menu; items flagged inPlan are covered by the plan), ''get_skip_dates'' (list
    skipped/paused deliveries), ''skip''/''unskip'' (one upcoming delivery date), ''set_skip_dates'' (replace
    the full skip set; [] resumes all), ''update_setting'' (change a setting). Locale settings: subscription_size
    (meals, e.g. 8), calorie_preference (low_calorie|both|moderate), diets (array), longevity_allergens
    (array), ingredient_allergies (array), default_window (''9am - 6pm''|''3pm - 7pm''|''9am - 12pm''),
    delivery_instructions (text). Link the merchant first.'
notes: Tool list is representative (the server advertises tools dynamically and the buy_* family is broader).
  See docs.agentcard.sh/companies/mcp and /personal/mcp for the full surface.
