aid: agentcard
name: Agentcard
description: >-
  Agentcard is a Y Combinator (Summer 2026) startup building card-issuing
  payments infrastructure for AI agents. It issues virtual Visa cards that are
  funded with a fixed USD amount and close after their first charge, giving
  agents scoped, single-use spending power with hard budget limits and no
  overdraft risk. Access is available three ways over one host: a REST v2 API,
  a hosted Model Context Protocol (MCP) server, and first-party CLIs. There are
  two products: Personal (an individual gives their own agent a card, funded via
  Apple Pay / Google Pay) and Companies ("Connect with Agentcard" — a platform
  issues cards to many users through OAuth 2.1 + PKCE). The platform covers user
  connect, identity verification (KYC), wallet funding, withdrawals, virtual card
  creation, transactions, and merchant shopping (buy) with HMAC-signed webhooks
  and a sandbox mode split from live by credential.
